audit_version = 1
candidate_rule = "Every examples/manifest.toml entry whose areas include pcbdoc or pcblib is classified exactly once."
accepted_layer_model = "PcbLayer remains the legacy TV6 enum. PcbLayerRef and semantic tokens are the V7-aware authoring, readback, SVG, and export boundary."

[[groups]]
classification = "v7_issue_sample"
layer_surfaces = ["authoring", "readback", "svg", "stackup"]
