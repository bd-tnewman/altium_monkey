  "pcbdoc_v7_128_signal_track_row",
  "pcb_v7_mechanical_layer_track_rows",
]
notes = "Issue-targeted samples for StackUpX-backed 128-signal authoring and public issue #23 Mechanical17 through Mechanical53 PcbDoc/PcbLib authoring plus SVG rendering."

